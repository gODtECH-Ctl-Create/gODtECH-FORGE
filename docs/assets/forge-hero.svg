<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
<title id="title">FORGE AI engineering operating framework</title>
<desc id="desc">Animated terminal-style visualization showing FORGE preparing repository context, governing AI work, and collecting verification evidence.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#08090d"/>
    <stop offset="0.52" stop-color="#11101a"/>
    <stop offset="1" stop-color="#171126"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" x2="1">
    <stop stop-color="#b7ff3c"/>
    <stop offset="0.5" stop-color="#b79cff"/>
    <stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" x2="1">
    <stop stop-color="#b7ff3c" stop-opacity="0"/>
    <stop offset="0.48" stop-color="#b7ff3c"/>
    <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#9b6cff" stroke-opacity="0.07"/></pattern>
  <clipPath id="clip"><rect width="1400" height="460" rx="30"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1400" height="460" fill="url(#bg)"/>
  <rect width="1400" height="460" fill="url(#grid)"/>

  <ellipse cx="1145" cy="40" rx="280" ry="180" fill="#7c3aed" opacity="0.11" filter="url(#glow)">
    <animate attributeName="rx" values="245;315;245" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.07;0.15;0.07" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="210" cy="430" rx="275" ry="155" fill="#b7ff3c" opacity="0.07" filter="url(#glow)">
    <animate attributeName="ry" values="125;175;125" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <path d="M-80 355 C225 205 485 430 760 245 S1185 110 1480 265" fill="none" stroke="url(#beam)" stroke-width="2" opacity="0.75">
    <animate attributeName="stroke-dasharray" values="20 80;140 28;20 80" dur="4.8s" repeatCount="indefinite"/>
  </path>

  <g transform="translate(70 64)">
    <rect width="1260" height="320" rx="28" fill="#090a0f" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="22" y="20" width="1216" height="34" rx="12" fill="#15121f" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="44" cy="37" r="4" fill="#ff5f57"/>
    <circle cx="61" cy="37" r="4" fill="#febc2e"/>
    <circle cx="78" cy="37" r="4" fill="#28c840"/>
    <text x="104" y="42" fill="#756e86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">FORGE / AI ENGINEERING CONTROL LAYER</text>

    <g transform="translate(42 82)">
      <rect width="132" height="132" rx="26" fill="#12101a" stroke="#b7ff3c" stroke-opacity="0.52"/>
      <rect x="28" y="28" width="76" height="76" rx="18" fill="url(#accent)"/>
      <text x="66" y="76" text-anchor="middle" fill="#0a0a0b" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900">FG</text>
      <circle cx="104" cy="28" r="6" fill="#b7ff3c" filter="url(#glow)">
        <animate attributeName="r" values="4;8;4" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(208 82)">
      <text x="0" y="18" fill="#b7ff3c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">DELIBERATE AI-ASSISTED ENGINEERING</text>
      <text x="0" y="70" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="850" letter-spacing="-2.5">gODtECH FORGE</text>
      <text x="0" y="103" fill="#aaa3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">prepare context → govern execution → verify with evidence</text>

      <g transform="translate(0 135)">
        <rect width="608" height="82" rx="15" fill="#08090d" stroke="#ffffff" stroke-opacity="0.10"/>
        <text x="18" y="27" fill="#b7ff3c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">$</text>
        <text x="36" y="27" fill="#f1edf7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">forge prepare --task "ship the change safely"</text>
        <text x="18" y="56" fill="#756e86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">✓ repo facts   ✓ bounded context   ✓ risk   ✓ verification</text>
        <rect x="18" y="68" width="560" height="3" rx="1.5" fill="#20182e"/>
        <rect x="18" y="68" width="130" height="3" rx="1.5" fill="#b7ff3c">
          <animate attributeName="width" values="45;540;180;45" dur="4s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <g transform="translate(1000 82)">
      <rect width="214" height="216" rx="20" fill="#12101a" stroke="#7c3aed" stroke-opacity="0.45"/>
      <text x="20" y="30" fill="#756e86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">CONTROL SIGNALS</text>
      <text x="20" y="69" fill="#f5f1fb" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">READY</text>
      <circle cx="174" cy="58" r="9" fill="#b7ff3c"><animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/></circle>
      <g fill="#aaa3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
        <text x="20" y="105">CONTEXT   → BOUNDED</text>
        <text x="20" y="128">RISK      → CLASSIFIED</text>
        <text x="20" y="151">MODEL     → PROPORTIONAL</text>
        <text x="20" y="174">APPROVALS → EXPLICIT</text>
        <text x="20" y="197">EVIDENCE  → RECORDED</text>
      </g>
    </g>

    <text x="42" y="294" fill="#686075" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1">TYPESCRIPT • NODE.JS • CUE • MCP • CACHED WORK PACKETS • HUMAN GATES • VERIFICATION</text>
  </g>

  <text x="700" y="427" text-anchor="middle" fill="#756e86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="4">PREPARE / REASON / GOVERN / VERIFY / SHIP</text>
</g>
</svg>