name: Validate FORGE schemas

on:
  pull_request:
    paths:
      - "forge/framework/.forge/schemas/**"
      - "forge/framework/.forge/context/project.yaml"
      - ".github/workflows/schemas.yml"
  push:
    branches:
      - main
    paths:
      - "forge/framework/.forge/schemas/**"
      - "forge/framework/.forge/context/project.yaml"
      - ".github/workflows/schemas.yml"

permissions:
  contents: read

jobs:
  cue:
    name: CUE contracts and fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install CUE
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.17.1

      - name: Compile schema package
        run: cue vet ./forge/framework/.forge/schemas

      - name: Validate project context
        run: cue vet -d '#ProjectContext' ./forge/framework/.forge/schemas ./forge/framework/.forge/context/project.yaml

      - name: Validate known-good fixtures
        run: |
          cue vet -d '#ModuleDocument' ./forge/framework/.forge/schemas ./forge/framework/.forge/schemas/examples/valid/module.yaml
          cue vet -d '#WorkflowDocument' ./forge/framework/.forge/schemas ./forge/framework/.forge/schemas/examples/valid/workflow.yaml
          cue vet -d '#DecisionRecord' ./forge/framework/.forge/schemas ./forge/framework/.forge/schemas/examples/valid/decision.yaml
          cue vet -d '#VerificationDocument' ./forge/framework/.forge/schemas ./forge/framework/.forge/schemas/examples/valid/verification.yaml
          cue vet -d '#WorkflowRun' ./forge/framework/.forge/schemas ./forge/framework/.forge/schemas/examples/valid/workflow-run.yaml

      - name: Reject known-invalid fixture
        run: |
          if cue vet -d '#ModuleDocument' ./forge/framework/.forge/schemas ./forge/framework/.forge/schemas/examples/invalid/module.yaml; then
            echo "Invalid fixture unexpectedly passed validation."
            exit 1
          fi
          echo "Invalid fixture was rejected as expected."
