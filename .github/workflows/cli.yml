name: Validate FORGE CLI

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/cli.yml"
      - ".forge/**"
      - "AGENTS.md"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/cli.yml"
      - ".forge/**"
      - "AGENTS.md"

permissions:
  contents: read

jobs:
  test:
    name: Build and test on Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run check

      - name: Build and test
        run: npm test

      - name: Verify CLI
        run: node dist/src/cli.js --version
