name: Validate FORGE CLI

on:
  pull_request:
    paths:
      - "forge/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/cli.yml"
      - ".github/workflows/release.yml"
      - "AGENTS.md"
  push:
    branches:
      - main
    paths:
      - "forge/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/cli.yml"
      - ".github/workflows/release.yml"
      - "AGENTS.md"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build and test
        run: npm test

      - name: Verify CLI
        run: node dist/src/cli.js --version

      - name: Inspect package contents
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm pack --dry-run

      - name: Check POSIX installer syntax
        if: matrix.node == 24 && matrix.os != 'windows-latest'
        shell: bash
        run: bash -n forge/release/install.sh

      - name: Check PowerShell installer syntax
        if: matrix.os == 'windows-latest' && matrix.node == 24
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "forge/release/install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  schema-smoke:
    name: Installed-project CUE validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install CUE
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.17.1

      - name: Build CLI
        run: |
          npm ci
          npm run build

      - name: Initialize and validate a clean project
        run: |
          node dist/src/cli.js init --cwd "${{ runner.temp }}/forge-smoke"
          node dist/src/cli.js validate --cwd "${{ runner.temp }}/forge-smoke" --strict
