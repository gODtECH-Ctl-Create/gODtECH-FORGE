name: Validate FORGE CLI

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/cli.yml"
      - ".forge/**"
      - "AGENTS.md"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/cli.yml"
      - ".forge/**"
      - "AGENTS.md"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build and test
        run: npm test

      - name: Verify CLI
        run: node dist/src/cli.js --version

      - name: Inspect package contents
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm pack --dry-run

  schema-smoke:
    name: Installed-project CUE validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install CUE
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.17.1

      - name: Build CLI
        run: |
          npm ci
          npm run build

      - name: Initialize and validate a clean project
        run: |
          node dist/src/cli.js init --cwd "${{ runner.temp }}/forge-smoke"
          node dist/src/cli.js validate --cwd "${{ runner.temp }}/forge-smoke" --strict
